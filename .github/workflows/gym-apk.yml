name: Build Forma gym APK
on:
  push:
    branches: [claude/convert-apk-mobile-jum6fr]
    paths: [gym-tracker-apk/**, .github/workflows/gym-apk.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        working-directory: gym-tracker-apk
        run: |
          npm i -g cordova@12
          cordova telemetry off
          cordova create /tmp/forma com.personal.gymtrack "Forma"
          rm -rf /tmp/forma/www && cp -r www /tmp/forma/www
          cp config.xml icon.png build.json gym.keystore /tmp/forma/
          cd /tmp/forma
          cordova platform add android@13
          cordova build android --release --buildConfig=build.json
          cp platforms/android/app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/gym-tracker-apk/Forma.apk
      - uses: actions/upload-artifact@v4
        with: { name: Forma-apk, path: gym-tracker-apk/Forma.apk }
      - name: Commit APK
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f gym-tracker-apk/Forma.apk
          git commit -m "Add built Forma.apk [skip ci]" && git push
