name: Build Pulso Global APK
on:
  push:
    branches: [claude/convert-apk-mobile-jum6fr]
    paths: [pulso-global-apk/**, .github/workflows/pulso-apk.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        working-directory: pulso-global-apk
        run: |
          npm i -g cordova@12
          cordova telemetry off
          cp ../pulso-global-apk/config.xml /tmp/config.xml
          cordova create /tmp/pulso com.personal.pulsoglobal "Pulso Global"
          rm -rf /tmp/pulso/www && cp -r www /tmp/pulso/www
          cp config.xml icon.png /tmp/pulso/
          cd /tmp/pulso
          cordova platform add android@13
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-advanced-http
          cordova build android --debug -- --packageType=apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/pulso-global-apk/PulsoGlobal.apk
      - uses: actions/upload-artifact@v4
        with: { name: PulsoGlobal-apk, path: pulso-global-apk/PulsoGlobal.apk }
      - name: Commit APK
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f pulso-global-apk/PulsoGlobal.apk
          git commit -m "Add built PulsoGlobal.apk [skip ci]" && git push
